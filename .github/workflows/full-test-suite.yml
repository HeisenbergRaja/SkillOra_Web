name: Full Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build / Application Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci || npm install
        
      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

  selenium-tests:
    name: Selenium E2E Tests
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Generate and Run Selenium Tests
        run: |
          npm install exceljs
          node selenium-tests/generate-and-run.js
      - name: Upload Selenium Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: selenium-test-results.xlsx

  load-tests:
    name: Load Tests
    needs: selenium-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Generate and Run Load Tests
        run: |
          npm install exceljs
          node load-tests/generate-and-run.js
      - name: Upload Load Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-test-results.xlsx

  security-tests:
    name: Security Tests
    needs: load-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Generate and Run Security Tests
        run: |
          npm install exceljs
          node security-tests/generate-and-run.js
      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-test-results
          path: |
            security-test-results.xlsx
            Vulnerability Test Results/

  final-summary:
    name: Final Test Suite Summary
    needs: [selenium-tests, load-tests, security-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Compile Master Report
        run: |
          npm install exceljs
          # Move artifacts to root for script to find them
          mv artifacts/selenium-test-results/selenium-test-results.xlsx . || true
          mv artifacts/load-test-results/load-test-results.xlsx . || true
          mv artifacts/security-test-results/security-test-results.xlsx . || true
          node compile-master-report.js
      - name: Upload Master Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-test-suite-report
          path: |
            final-test-suite-report.xlsx
            final-test-suite-summary.md
      - name: Output Job Summary
        run: |
          cat final-test-suite-summary.md >> $GITHUB_STEP_SUMMARY
